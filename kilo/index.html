<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kilo · Track your lifts</title>
    <link rel="shortcut icon" type="image/png" href="./images/app-icon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background-color: #09090b;
            color: #ffffff;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Navigation */
        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 32px;
            max-width: 1280px;
            margin: 0 auto;
            opacity: 0;
            transform: translateY(-20px);
            animation: fadeSlideDown 0.8s ease-out forwards;
        }

        .nav__logo {
            height: 32px;
            filter: invert(1);
            opacity: 0.9;
            transition: opacity 0.2s, transform 0.2s;
        }

        .nav__logo:hover {
            opacity: 1;
            transform: scale(1.02);
        }

        .nav__contact {
            font-size: 14px;
            color: #a1a1aa;
            text-decoration: none;
            transition: color 0.2s, transform 0.2s;
        }

        .nav__contact:hover {
            color: #ffffff;
            transform: translateX(2px);
        }

        /* Hero */
        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 32px 200px;
            max-width: 1024px;
            margin: 0 auto;
        }

        .hero__icon-wrap {
            margin-bottom: 64px;
            opacity: 0;
            transform: scale(0.95);
            animation: fadeScaleIn 1s ease-out 0.2s forwards;
        }

        .hero__icon {
            width: 160px;
            height: 160px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease-out;
        }

        .hero__icon:hover {
            transform: scale(1.02) rotate(-3deg);
        }

        .hero__title {
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 700;
            letter-spacing: -0.025em;
            text-align: center;
            margin-bottom: 24px;
            max-width: 900px;
            line-height: 1.05;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeSlideUp 0.8s ease-out 0.5s forwards;
        }

        .hero__title-muted {
            color: #a1a1aa;
        }

        .hero__subtitle {
            font-size: clamp(1.25rem, 2.5vw, 1.5rem);
            color: #a1a1aa;
            text-align: center;
            margin-bottom: 48px;
            max-width: 640px;
            line-height: 1.5;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeSlideUp 0.8s ease-out 0.7s forwards;
        }

        .hero__cta-wrap {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeSlideUp 0.8s ease-out 0.9s forwards;
        }

        .hero__cta {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background-color: #ffffff;
            color: #000000;
            padding: 20px 48px;
            border-radius: 9999px;
            font-size: 18px;
            font-weight: 500;
            text-decoration: none;
            transition: background-color 0.15s, box-shadow 0.3s, transform 0.15s;
        }

        .hero__cta:hover {
            background-color: #e4e4e7;
            box-shadow: 0 10px 40px rgba(255, 255, 255, 0.2);
        }

        .hero__cta:active {
            transform: scale(0.98);
        }

        .hero__cta svg {
            width: 24px;
            height: 24px;
        }

        /* Phones scroll section */
        .phones-section {
            position: relative;
            height: 200vh;
        }

        .phones-sticky {
            position: sticky;
            top: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .phones-container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 1152px;
            height: 600px;
        }

        .phone {
            position: absolute;
            width: 288px;
            will-change: transform;
        }

        .phone img {
            width: 100%;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .phone--1 {
            z-index: 10;
        }

        .phone--2 {
            z-index: 20;
        }

        .phone--3 {
            z-index: 10;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 48px 32px;
            opacity: 0;
            animation: fadeIn 0.8s ease-out 1.5s forwards;
        }

        .footer__email {
            color: #52525b;
            font-size: 14px;
            text-decoration: none;
            transition: color 0.2s, transform 0.2s;
            display: inline-block;
        }

        .footer__email:hover {
            color: #a1a1aa;
            transform: translateY(-1px);
        }

        /* Animations */
        @keyframes fadeSlideDown {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeSlideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeScaleIn {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .nav {
                padding: 20px 24px;
            }

            .hero {
                padding: 60px 24px;
            }

            .hero__icon {
                width: 120px;
                height: 120px;
            }

            .hero__icon-wrap {
                margin-bottom: 48px;
            }

            .hero__cta {
                padding: 16px 36px;
                font-size: 16px;
            }

            .phone {
                width: 200px;
            }

            .phones-section {
                height: 120vh;
            }
        }

        @media (max-width: 480px) {
            .phone {
                width: 160px;
            }
        }
    </style>
</head>
<body>

    <nav class="nav">
        <a href="/kilo/">
            <img class="nav__logo" src="./images/wordmark.png" alt="Kilo">
        </a>
        <a class="nav__contact" href="mailto:kilolifting@gmail.com">Contact</a>
    </nav>

    <main class="hero">
        <div class="hero__icon-wrap">
            <img class="hero__icon" src="./images/app-icon.png" alt="Kilo App">
        </div>

        <h1 class="hero__title">
            Track your lifts. <span class="hero__title-muted">Build your strength.</span>
        </h1>

        <p class="hero__subtitle">
            Log workouts, track PRs and see your progress. Train with intent.
        </p>

        <div class="hero__cta-wrap">
            <a class="hero__cta" href="https://apps.apple.com/app/kilo-your-lifts-in-one-place/id6739643969" target="_blank" rel="noopener noreferrer">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
                </svg>
                Download now
            </a>
        </div>
    </main>

    <section class="phones-section" id="phones-section">
        <div class="phones-sticky">
            <div class="phones-container">
                <div class="phone phone--1" id="phone-1">
                    <img src="./images/app-screen-1.png" alt="Kilo App Screen 1">
                </div>
                <div class="phone phone--2" id="phone-2">
                    <img src="./images/app-screen-2.png" alt="Kilo App Screen 2">
                </div>
                <div class="phone phone--3" id="phone-3">
                    <img src="./images/app-screen-3.png" alt="Kilo App Screen 3">
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <a class="footer__email" href="mailto:kilolifting@gmail.com">kilolifting@gmail.com</a>
    </footer>

    <script>
        (function() {
            var section = document.getElementById('phones-section');
            var phone1 = document.getElementById('phone-1');
            var phone2 = document.getElementById('phone-2');
            var phone3 = document.getElementById('phone-3');

            if (!section || !phone1 || !phone2 || !phone3) return;

            var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (reducedMotion) {
                phone1.style.transform = 'translateX(-350px) rotate(0deg)';
                phone3.style.transform = 'translateX(350px) rotate(0deg)';
                return;
            }

            function lerp(start, end, t) {
                return start + (end - start) * t;
            }

            function clamp(val, min, max) {
                return Math.max(min, Math.min(max, val));
            }

            function easeOutCubic(t) {
                return 1 - Math.pow(1 - t, 3);
            }

            function onScroll() {
                var rect = section.getBoundingClientRect();
                var windowH = window.innerHeight;
                var scrollableDistance = rect.height - windowH;

                if (scrollableDistance <= 0) return;

                var earlyStart = windowH * 0.4;
                var scrolled = -rect.top + earlyStart;
                var progress = clamp(scrolled / scrollableDistance, 0, 1);
                var easedProgress = easeOutCubic(progress);

                var maxSpread = window.innerWidth < 768 ? 180 : 350;

                var phone1X = lerp(0, -maxSpread, easedProgress);
                var phone1Rot = lerp(-15, 0, easedProgress);
                var phone1Y = lerp(50, 0, easedProgress);

                var phone3X = lerp(0, maxSpread, easedProgress);
                var phone3Rot = lerp(15, 0, easedProgress);
                var phone3Y = lerp(50, 0, easedProgress);

                phone1.style.transform = 'translateX(' + phone1X + 'px) translateY(' + phone1Y + 'px) rotate(' + phone1Rot + 'deg)';
                phone2.style.transform = 'translateX(0px) rotate(0deg)';
                phone3.style.transform = 'translateX(' + phone3X + 'px) translateY(' + phone3Y + 'px) rotate(' + phone3Rot + 'deg)';
            }

            var ticking = false;
            window.addEventListener('scroll', function() {
                if (!ticking) {
                    window.requestAnimationFrame(function() {
                        onScroll();
                        ticking = false;
                    });
                    ticking = true;
                }
            }, { passive: true });

            onScroll();
        })();
    </script>

</body>
</html>
