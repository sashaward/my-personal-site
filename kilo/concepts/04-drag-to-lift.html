<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kilo · Lift it</title>
<link rel="shortcut icon" type="image/png" href="../images/app-icon.png">
<link rel="stylesheet" href="kilo.css">
<style>
    body { background: #050506; }
    body.locked { overflow: hidden; height: 100svh; }

    /* ---- The lift ---- */
    .platform {
        position: relative; height: 100svh; overflow: hidden;
        display: flex; flex-direction: column; justify-content: flex-end;
        touch-action: none;
    }

    /* Floor line — what the bar is resting on. */
    .floor {
        position: absolute; left: 0; right: 0; bottom: 96px; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,.16) 22%,
                    rgba(255,255,255,.16) 78%, transparent);
    }
    .floor::after {
        content: ''; position: absolute; left: 0; right: 0; top: 0; height: 120px;
        background: linear-gradient(to bottom, rgba(255,255,255,.028), transparent);
    }

    .brand { position: absolute; top: 22px; left: 28px; z-index: 5; }
    .brand img { height: 24px; }

    .instruction {
        position: absolute; top: 50%; left: 0; right: 0; text-align: center;
        transform: translateY(-50%); z-index: 1; pointer-events: none;
        transition: opacity .4s ease;
    }
    .instruction .big {
        font-size: clamp(1.6rem, 4.4vw, 2.6rem); font-weight: 600; letter-spacing: -.03em;
        color: rgba(255,255,255,.2);
    }
    .instruction .small { font-size: 12px; letter-spacing: .16em; text-transform: uppercase;
                          color: #33333a; margin-top: 12px; }
    .lifted .instruction { opacity: 0; }

    /* Effort gauge fills as you pull. */
    .effort {
        position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%);
        width: min(300px, 62vw); z-index: 4; text-align: center;
        transition: opacity .4s ease;
    }
    .effort .track { height: 3px; border-radius: 2px; background: rgba(255,255,255,.1);
                     overflow: hidden; }
    .effort .fill { height: 100%; width: 0%; background: var(--acid);
                    transition: background .2s; }
    .effort .label { font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
                     color: #3b3b42; margin-top: 12px; }
    .lifted .effort { opacity: 0; }

    /* The thing being lifted: headline + loaded bar, as one rigid object. */
    .load {
        position: relative; z-index: 3; margin-bottom: 96px;
        will-change: transform; cursor: grab;
        user-select: none; -webkit-user-select: none;
    }
    .load.dragging { cursor: grabbing; }
    .load h1 {
        font-size: clamp(2.6rem, 9vw, 7rem); font-weight: 700; letter-spacing: -.045em;
        line-height: .95; text-align: center; margin-bottom: 34px; padding: 0 24px;
    }
    .load h1 span { color: var(--steel); display: block; }
    .load .kbar { width: min(1100px, 92vw); height: auto; display: block; margin: 0 auto;
                  overflow: visible; }
    .kbar__total { display: none; }
    .kbar__plate { animation: none; }

    /* Bar flexes under load as you pull — the whip. */
    .load .kbar { transform-origin: center; }

    /* ---- Everything below, which drops in once the bar is overhead ---- */
    .after { padding: 0 24px; }
    .after > * { opacity: 0; }
    .lifted .after > * { animation: massDrop .68s cubic-bezier(.24,1.34,.42,1) forwards; }
    .lifted .after > *:nth-child(1) { animation-delay: .05s; }
    .lifted .after > *:nth-child(2) { animation-delay: .16s; }
    .lifted .after > *:nth-child(3) { animation-delay: .27s; }
    .lifted .after > *:nth-child(4) { animation-delay: .38s; }
    @keyframes massDrop {
        0%   { opacity: 0; transform: translateY(-120px); }
        100% { opacity: 1; transform: translateY(0); }
    }

    .after { max-width: 900px; margin: 0 auto; padding-bottom: 100px; }
    .after .claim {
        text-align: center; padding: 96px 0 0;
    }
    .after .claim h2 { font-size: clamp(1.9rem, 5vw, 3.4rem); font-weight: 700;
                       letter-spacing: -.035em; line-height: 1.06; margin-bottom: 16px; }
    .after .claim h2 em { font-style: normal; color: var(--acid); }
    .after .claim p { color: var(--bluegray); max-width: 44ch; margin: 0 auto;
                      font-size: 1.08rem; line-height: 1.55; }

    .shots { display: flex; justify-content: center; gap: 18px; margin-top: 70px; flex-wrap: wrap; }
    .shots img { width: 196px; border-radius: 18px;
                 box-shadow: 0 30px 60px -18px rgba(0,0,0,.85); }

    .end { text-align: center; margin-top: 80px; }
    .cta { display: inline-flex; align-items: center; gap: 10px; background: #fff; color: #000;
           padding: 17px 38px; border-radius: 999px; font-size: 16px; font-weight: 500;
           text-decoration: none; transition: transform .14s, box-shadow .3s; }
    .cta:hover { box-shadow: 0 12px 40px rgba(255,255,255,.18); }
    .cta:active { transform: scale(.98); }
    .cta svg { width: 20px; height: 20px; }
    .end .mail { display: block; margin-top: 30px; color: #3f3f46; font-size: 13px;
                 text-decoration: none; }

    @media (max-width: 620px) {
        .shots img { width: 140px; }
        .load { margin-bottom: 80px; }
        .floor { bottom: 80px; }
    }
</style>
</head>
<body class="locked">

<div class="platform" id="platform">
    <div class="brand"><a href="/kilo/"><img class="k-wordmark" src="../images/wordmark.png" alt="Kilo"></a></div>
    <div class="floor"></div>

    <div class="instruction" id="instruction">
        <p class="big">It's 180 kg.</p>
        <p class="small">Drag it up</p>
    </div>

    <div class="load" id="load" role="button" tabindex="0"
         aria-label="Drag upward to lift the bar and reveal the page">
        <h1>Nothing moves<span>until you move it.</span></h1>
        <div id="bar"></div>
    </div>

    <div class="effort" id="effort">
        <div class="track"><div class="fill" id="fill"></div></div>
        <p class="label" id="effort-label">Grip it</p>
    </div>
</div>

<div class="after">
    <div class="claim">
        <h2>Strength is the <em>only</em> honest metric.</h2>
        <p>Not streaks. Not badges. Not how many days in a row you opened an app.
           Kilo tracks the one number that can't be gamed — what you lifted.</p>
    </div>

    <div class="shots">
        <img src="../images/app-screen-1.png" alt="">
        <img src="../images/app-screen-2.png" alt="">
        <img src="../images/app-screen-3.png" alt="">
    </div>

    <div class="end">
        <a class="cta" href="https://apps.apple.com/app/kilo-your-lifts-in-one-place/id6739643969"
           target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
            Download Kilo
        </a>
        <a class="mail" href="mailto:kilolifting@gmail.com">kilolifting@gmail.com</a>
    </div>
</div>

<script src="plates.js"></script>
<script src="concept.js"></script>
<script>
(function () {
    var platform = document.getElementById('platform');
    var load     = document.getElementById('load');
    var fill     = document.getElementById('fill');
    var effortLb = document.getElementById('effort-label');
    var instr    = document.getElementById('instruction');

    document.getElementById('bar').innerHTML =
        Kilo.renderBar(Kilo.calculatePlates(180, { barWeight: 20 }),
                       { showLabels: false, animate: false });

    var svg = load.querySelector('svg');

    var LIFT_DISTANCE = 260;   // pixels of pull that count as a completed lift
    var lifted = false;
    var dragging = false;
    var startY = 0;
    var pull = 0;              // raw pull in px
    var y = 0;                 // rendered offset
    var vel = 0;
    var raf = null;

    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // Resistance: the bar gets heavier the higher it goes, so the last third is
    // the hard part — the same shape as the real lift.
    function resist(raw) {
        var t = Math.max(0, raw) / LIFT_DISTANCE;
        var eased = 1 - Math.pow(1 - Math.min(t, 1), 1.9);
        return eased * LIFT_DISTANCE + Math.max(0, raw - LIFT_DISTANCE) * 0.25;
    }

    function paint() {
        var progress = Math.min(1, Math.max(0, y / LIFT_DISTANCE));
        load.style.transform = 'translate3d(0,' + (-y) + 'px,0)';
        // Whip: the sleeves bend as the middle is pulled.
        if (svg) {
            svg.style.transform = 'scaleY(' + (1 - progress * 0.035).toFixed(4) + ')';
        }
        fill.style.width = (progress * 100).toFixed(1) + '%';
        fill.style.background = progress > 0.75 ? '#c6f24e'
            : progress > 0.35 ? '#ffd959' : '#e4623f';

        if (!lifted) {
            effortLb.textContent = progress < 0.04 ? 'Grip it'
                : progress < 0.4 ? 'Off the floor'
                : progress < 0.75 ? 'Through the knee'
                : progress < 1 ? 'Lock it out' : 'Good lift';
        }
    }

    function spring() {
        // Settle back toward the floor when released short of lockout.
        vel += (0 - y) * 0.16;
        vel *= 0.72;
        y += vel;
        if (Math.abs(y) < 0.4 && Math.abs(vel) < 0.4) {
            y = 0; vel = 0; paint(); raf = null; return;
        }
        paint();
        raf = requestAnimationFrame(spring);
    }

    function complete() {
        if (lifted) return;
        lifted = true;
        dragging = false;
        if (raf) { cancelAnimationFrame(raf); raf = null; }

        load.style.transition = 'transform .7s cubic-bezier(.2,.9,.25,1)';
        load.style.transform = 'translate3d(0,' + (-LIFT_DISTANCE - 40) + 'px,0)';
        if (svg) svg.style.transition = 'transform .7s ease';

        document.body.classList.remove('locked');
        platform.classList.add('lifted');
        document.body.classList.add('lifted');
        effortLb.textContent = 'Good lift';
        load.style.cursor = 'default';

        setTimeout(function () {
            window.scrollTo({ top: window.innerHeight * 0.55, behavior: 'smooth' });
        }, 620);
    }

    function down(clientY) {
        if (lifted) return;
        dragging = true;
        startY = clientY;
        if (raf) { cancelAnimationFrame(raf); raf = null; }
        load.classList.add('dragging');
        instr.style.opacity = '.25';
    }

    function move(clientY) {
        if (!dragging || lifted) return;
        pull = startY - clientY;
        y = resist(pull);
        paint();
        if (y >= LIFT_DISTANCE) complete();
    }

    function up() {
        if (!dragging || lifted) return;
        dragging = false;
        load.classList.remove('dragging');
        instr.style.opacity = '';
        vel = 0;
        raf = requestAnimationFrame(spring);
    }

    load.addEventListener('pointerdown', function (e) {
        load.setPointerCapture(e.pointerId);
        down(e.clientY);
    });
    load.addEventListener('pointermove', function (e) { move(e.clientY); });
    load.addEventListener('pointerup', up);
    load.addEventListener('pointercancel', up);

    // Wheel and keyboard both count as pulling, so a trackpad or keyboard can lift it too.
    platform.addEventListener('wheel', function (e) {
        if (lifted) return;
        e.preventDefault();
        pull = Math.max(0, pull + e.deltaY * 0.85);
        y = resist(pull);
        paint();
        if (y >= LIFT_DISTANCE) complete();
    }, { passive: false });

    load.addEventListener('keydown', function (e) {
        if (lifted) return;
        if (e.key === 'ArrowUp' || e.key === ' ' || e.key === 'Enter') {
            e.preventDefault();
            pull += 60;
            y = resist(pull);
            paint();
            if (y >= LIFT_DISTANCE) complete();
        }
    });

    // Anyone who prefers reduced motion gets the page without the workout.
    if (reduced) {
        LIFT_DISTANCE = 1;
        complete();
    }

    paint();
})();
</script>
</body>
</html>
