<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kilo · Site concepts</title>
<link rel="shortcut icon" type="image/png" href="../images/app-icon.png">
<link rel="stylesheet" href="kilo.css">
<style>
    /* ---- Mosaic tiles ---- */
    .thumb {
        position: relative; overflow: hidden; cursor: pointer;
        border-radius: var(--radius); background: #050505;
    }
    .thumb iframe {
        position: absolute; top: 0; left: 0; border: 0;
        transform-origin: top left; pointer-events: none;
    }
    .thumb .veil {
        position: absolute; inset: 0; z-index: 2; opacity: 0;
        display: flex; align-items: center; justify-content: center;
        background: rgba(0,0,0,.5); transition: opacity .22s;
    }
    .thumb:hover .veil, .thumb:focus-visible .veil { opacity: 1; }
    .thumb .veil span {
        border-radius: var(--radius-pill); padding: 11px 22px;
        background: rgba(255,255,255,.9); color: #000;
        font-size: 12px; font-weight: 500;
    }
    .thumb .idx {
        position: absolute; top: 8px; left: 8px; z-index: 3;
        font-size: 11px; font-weight: 500; letter-spacing: .02em;
        color: rgba(255,255,255,.55); mix-blend-mode: difference;
    }

    /* ---- Text tiles sit in the same grid as the work ---- */
    .txt {
        background: var(--tile); border-radius: var(--radius);
        padding: 22px 20px 24px;
    }
    .txt h1 {
        font-size: clamp(1.45rem, 2.2vw, 1.9rem);
        font-weight: 700; letter-spacing: -0.03em; line-height: 1.04;
        margin-bottom: 14px;
    }
    .txt p { font-size: 14px; font-weight: 500; letter-spacing: -0.01em;
             line-height: 1.35; color: var(--fg-2); }
    .txt p + p { margin-top: 12px; }
    .txt p a { color: var(--fg); text-decoration: none;
               border-bottom: 1px solid var(--fg-3); }
    .txt p a:hover { border-bottom-color: var(--fg); }

    .mark {
        background: var(--tile); border-radius: var(--radius);
        aspect-ratio: 16 / 7; display: flex; align-items: center;
        justify-content: center; padding: 18px;
    }
    .mark img { width: 72%; max-width: 260px; height: auto; }

    .stat { display: flex; gap: 2px; flex-direction: column; }
    .stat .row {
        background: var(--tile); border-radius: var(--radius);
        padding: 13px 16px; display: flex; justify-content: space-between;
        align-items: baseline; gap: 12px;
    }
    .stat .row b { font-size: 14px; font-weight: 500; letter-spacing: -0.01em; }
    .stat .row span { font-size: 14px; font-weight: 500; letter-spacing: -0.01em;
                      color: var(--fg-2); text-align: right; }

    /* ---- Viewer ---- */
    .viewer { position: fixed; inset: 0; z-index: 200; background: #000;
              display: none; flex-direction: column; }
    .viewer.open { display: flex; }
    /* The dock is fixed and sits above the viewer's stacking context, so it has
       to be taken out explicitly rather than relying on z-index. */
    body.viewing .og-dock { display: none; }

    .vbar { display: flex; align-items: center; gap: 10px; flex: none;
            padding: 8px; }
    .vbar .who { display: flex; align-items: baseline; gap: 9px; min-width: 0;
                 padding-left: 8px; white-space: nowrap; overflow: hidden; }
    .vbar .who b { font-size: 14px; font-weight: 500; letter-spacing: -0.01em;
                   overflow: hidden; text-overflow: ellipsis; }
    .vbar .who span { font-size: 14px; font-weight: 500; letter-spacing: -0.01em;
                      color: var(--fg-2); }
    .vbar .spacer { flex: 1; }

    .vbar button, .vbar a {
        font-family: inherit; font-size: 12px; font-weight: 500; cursor: pointer;
        text-decoration: none; border: 0; border-radius: var(--radius-pill);
        background: rgba(255,255,255,.14); color: var(--fg); padding: 10px 16px;
        transition: background .18s;
    }
    .vbar button:hover, .vbar a:hover { background: rgba(255,255,255,.26); }
    .vbar .seg { display: inline-flex; gap: 2px; }
    .vbar .seg button[aria-pressed="true"] { background: var(--fg); color: #000; }
    .vbar .count { font-size: 12px; font-weight: 500; color: var(--fg-2);
                   font-variant-numeric: tabular-nums; min-width: 4ch;
                   text-align: center; }

    .note {
        flex: none; padding: 0 16px 10px; font-size: 14px; font-weight: 500;
        letter-spacing: -0.01em; line-height: 1.35; color: var(--fg-2);
        max-width: 92ch;
    }
    .note b { color: var(--fg); font-weight: 500; }

    .stage { flex: 1; min-height: 0; display: flex; align-items: center;
             justify-content: center; padding: 0 8px 8px; }
    .stage iframe { border: 0; width: 100%; height: 100%; background: #000;
                    border-radius: var(--radius); display: block; }
    .stage.phone { padding: 0 8px 16px; }
    .stage.phone iframe { width: 390px; max-width: 100%; flex: none;
                          border-radius: 18px; }

    @media (max-width: 900px) {
        .og-mosaic { flex-direction: column; }
        .vbar .seg { display: none; }
        .vbar .who span { display: none; }
        .note { display: none; }
    }
</style>
</head>
<body>

<div class="og-mosaic" id="mosaic"></div>

<div class="og-dock">
    <a class="og-pill og-pill--ghost" href="../">Current site</a>
    <a class="og-pill og-pill--solid" href="mailto:kilolifting@gmail.com">Contact</a>
</div>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Concept preview">
    <div class="vbar">
        <span class="who"><b id="v-title">—</b><span id="v-from"></span></span>
        <span class="spacer"></span>
        <span class="seg">
            <button type="button" id="v-desktop" aria-pressed="true">Desktop</button>
            <button type="button" id="v-phone" aria-pressed="false">Phone</button>
        </span>
        <button type="button" id="v-prev" aria-label="Previous concept">←</button>
        <span class="count" id="v-count">1/5</span>
        <button type="button" id="v-next" aria-label="Next concept">→</button>
        <a id="v-open" href="#" target="_blank" rel="noopener">Open ↗</a>
        <button type="button" id="v-close" aria-label="Close preview">Close</button>
    </div>
    <p class="note" id="v-note"></p>
    <div class="stage" id="v-stage"><iframe id="v-frame" title="Concept preview"></iframe></div>
</div>

<script src="concept.js"></script>
<script>
(function () {
    var M = KiloConcepts.MANIFEST;

    /* Per-concept: the caption line, the tile's aspect ratio, and the longer
       note shown in the viewer. Ratios are varied deliberately so the mosaic
       has the same uneven rhythm as a studio index rather than a card grid. */
    var META = {
        1: { cat: 'Working tool', ratio: 4 / 5,
             note: '<b>Bet:</b> a tool people actually use beats a headline they skim. ' +
                   '<b>Risk:</b> it demos one feature, not the product.' },
        2: { cat: 'Scroll mechanic', ratio: 1,
             note: '<b>Bet:</b> nobody else can credibly own these five colours. ' +
                   '<b>Risk:</b> the gimmick has to survive a second visit.' },
        3: { cat: 'Personalisation', ratio: 4 / 3,
             note: '<b>Bet:</b> something a screenshot grid can never do. ' +
                   '<b>Risk:</b> a gate before the content costs you visitors.' },
        4: { cat: 'Direct manipulation', ratio: 3 / 4,
             note: '<b>Bet:</b> the visitor performs the product’s subject matter. ' +
                   '<b>Risk:</b> friction in front of the pitch.' },
        5: { cat: 'Typographic', ratio: 1,
             note: '<b>Bet:</b> refusing screenshots is the boldest thing an app site can do. ' +
                   '<b>Risk:</b> people may still want to see the app.' }
    };

    function tile(i) {
        var c = M[i], m = META[c.n];
        return '<div>' +
            '<div class="thumb" data-i="' + i + '" role="button" tabindex="0" ' +
                 'style="aspect-ratio:' + m.ratio + '" aria-label="Preview ' + c.title + '">' +
                '<span class="idx">' + String(c.n).padStart(2, '0') + '</span>' +
                '<iframe src="' + c.file + '" tabindex="-1" aria-hidden="true" ' +
                        'scrolling="no" loading="lazy" data-ratio="' + m.ratio + '"></iframe>' +
                '<span class="veil"><span>Preview</span></span>' +
            '</div>' +
            '<div class="og-cap og-meta"><b>' + c.title + '</b>' +
                '<span>' + m.cat + ', ' + c.idea + '</span></div>' +
        '</div>';
    }

    var lede =
        '<div class="txt">' +
            '<h1>Five directions, built to be clicked.</h1>' +
            '<p>Each one is a real working page, not a mockup — same product, ' +
               'five different bets on what the site should <em>be</em>.</p>' +
            '<p>They share Kilo’s own design tokens and a JavaScript port of the ' +
               'app’s plate-solving algorithm, so every weight shown is a weight ' +
               'you could really load. Compare against <a href="../">the current page</a>.</p>' +
        '</div>';

    var stats =
        '<div class="stat">' +
            '<div class="row"><b>Concepts</b><span>5</span></div>' +
            '<div class="row"><b>Previews</b><span>Live, not screenshots</span></div>' +
            '<div class="row"><b>Switch</b><span>← → or 1–5</span></div>' +
            '<div class="row"><b>Build step</b><span>None</span></div>' +
        '</div>';

    var mark = '<div class="mark"><img class="k-wordmark" src="../images/wordmark.png" alt="Kilo"></div>';

    // The page as it stands today, live in the same grid, so the concepts are
    // judged against the real thing rather than a memory of it.
    var current =
        '<div>' +
            '<div class="thumb" style="aspect-ratio:1.6" onclick="window.open(\'../\')">' +
                '<span class="idx">00</span>' +
                '<iframe src="../" tabindex="-1" aria-hidden="true" scrolling="no" ' +
                        'loading="lazy" data-ratio="1.6"></iframe>' +
                '<span class="veil"><span>Open ↗</span></span>' +
            '</div>' +
            '<div class="og-cap og-meta"><b>Current site</b><span>Live, today</span></div>' +
        '</div>';

    // Hand-composed columns, balanced by eye for total height — an even
    // distribution would flatten the rhythm and leave one column short.
    var columns = [
        [mark, tile(0), current],
        [lede, tile(1), tile(2), stats],
        [tile(3), tile(4)]
    ];

    document.getElementById('mosaic').innerHTML = columns.map(function (col) {
        return '<div class="og-col">' + col.join('') + '</div>';
    }).join('');

    /* Each thumbnail renders the real page at 1440px wide and is scaled to fit
       its tile. Frame height follows the tile ratio so a tall tile shows more
       of the page rather than cropping it. */
    function fitThumbs() {
        Array.prototype.forEach.call(document.querySelectorAll('.thumb'), function (t) {
            var f = t.querySelector('iframe');
            var ratio = parseFloat(f.dataset.ratio);
            var s = t.clientWidth / 1440;
            f.style.width = '1440px';
            f.style.height = (1440 / ratio) + 'px';
            f.style.transform = 'scale(' + s + ')';
        });
    }
    fitThumbs();
    window.addEventListener('resize', fitThumbs);

    /* ---- Viewer ---- */
    var viewer = document.getElementById('viewer');
    var frame  = document.getElementById('v-frame');
    var stage  = document.getElementById('v-stage');
    var cur = 0, phone = false;

    function show(i) {
        cur = (i + M.length) % M.length;
        var c = M[cur];
        frame.src = c.file;
        document.getElementById('v-title').textContent = c.title;
        document.getElementById('v-from').textContent = META[c.n].cat + ', ' + c.idea;
        document.getElementById('v-note').innerHTML = META[c.n].note;
        document.getElementById('v-count').textContent = (cur + 1) + '/' + M.length;
        document.getElementById('v-open').href = c.file;
    }

    function open(i) {
        show(i);
        viewer.classList.add('open');
        document.body.classList.add('viewing');
        document.body.style.overflow = 'hidden';
    }
    function close() {
        viewer.classList.remove('open');
        document.body.classList.remove('viewing');
        document.body.style.overflow = '';
        frame.src = 'about:blank';
    }
    function setPhone(on) {
        phone = on;
        stage.classList.toggle('phone', on);
        document.getElementById('v-phone').setAttribute('aria-pressed', String(on));
        document.getElementById('v-desktop').setAttribute('aria-pressed', String(!on));
    }

    document.getElementById('mosaic').addEventListener('click', function (e) {
        var t = e.target.closest('[data-i]');
        if (t) open(parseInt(t.dataset.i, 10));
    });
    document.getElementById('mosaic').addEventListener('keydown', function (e) {
        var t = e.target.closest('.thumb[data-i]');
        if (t && (e.key === 'Enter' || e.key === ' ')) {
            e.preventDefault();
            open(parseInt(t.dataset.i, 10));
        }
    });

    document.getElementById('v-prev').addEventListener('click', function () { show(cur - 1); });
    document.getElementById('v-next').addEventListener('click', function () { show(cur + 1); });
    document.getElementById('v-close').addEventListener('click', close);
    document.getElementById('v-phone').addEventListener('click', function () { setPhone(true); });
    document.getElementById('v-desktop').addEventListener('click', function () { setPhone(false); });

    document.addEventListener('keydown', function (e) {
        if (!viewer.classList.contains('open')) return;
        if (e.key === 'Escape') close();
        else if (e.key === 'ArrowLeft') show(cur - 1);
        else if (e.key === 'ArrowRight') show(cur + 1);
        else if (e.key.toLowerCase() === 'p') setPhone(!phone);
        else if (/^[1-5]$/.test(e.key)) show(parseInt(e.key, 10) - 1);
    });
})();
</script>
</body>
</html>
